# Nativní umělci — danbooru tagy umělců, které model zná z tréninku.
# Zdroj: build/lab/noobai-artists-v3 (2026-09-21), 978 jmen. Tam měl každý
# umělec jinou pózu, oblečení i účes, takže se buňky nedaly srovnat; tady je
# námět pevný a mění se jen tag umělce.
#
# Jen rodina `danbooru` — soubor je pro tagové modely. S modelem z jiné rodiny
# (Juggernaut, FLUX) lab běh zastaví, a to je správně: tag umělce jim nic neříká.
# Syntaxe `artist:jméno` je ta, kterou čte NoobAI; `baseline` je námět bez tagu.
# Celý seznam je na jeden model; pro srovnání víc modelů je
# native-artists-sample.yaml.
#
#   lab run --prompts-yaml tools/lab/candidates/native-artists.yaml \
#           --models noobai-xl --flows txt2img --no-styles --latent 832x1216

