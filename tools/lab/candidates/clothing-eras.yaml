# Matice D — móda podle doby. Řádky = doba, sloupce = modely, bez stylu.
#
# Otázka: pozná model dobu, nebo jen přebarví obrázek? Scéna je všude táž
# (dospělý pár stojí vedle sebe na ulici, celé postavy), mění se jen oblečení.
#
# Každá doba je dvakrát — ablace „štítek, nebo popis“ (jako jméno × popis
# u umělců ve vlně 3):
#   <doba>-label  jen název doby
#   <doba>-desc   konkrétní kusy oblečení a účesy, bez názvu doby
# `baseline` je táž scéna bez jakéhokoli údaje o oblečení.
#
#   lab run --prompts-yaml tools/lab/candidates/clothing-eras.yaml \
#           --models juggernaut-xl,flux-manga,illustrious-xl \
#           --flows txt2img --no-styles

