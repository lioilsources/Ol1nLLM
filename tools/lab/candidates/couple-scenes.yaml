# Matice F — scény páru. Řádky = scéna, sloupce = modely, bez stylu.
#
# Otázka: jsou na obrázku dva lidé, je akce poznat, drží ruce a tváře?
# Oblečení je všude stejné (současné, běžné), aby se měnila jen scéna.
# Obě postavy jsou výslovně dospělé; „do školy“ je univerzitní kampus.
#
#   lab run --prompts-yaml tools/lab/candidates/couple-scenes.yaml \
#           --models juggernaut-xl,flux-manga,illustrious-xl \
#           --flows txt2img --no-styles --sweep 'param.seed=777|778|779'

holding-hands:
  danbooru: "1girl, 1boy, hetero, couple, adult, holding hands, walking, full body, casual clothes, jeans, city street, day"
  juggernaut: "an adult couple, a man and a woman in their late twenties, walking and holding hands, full body, casual clothes, city street, daylight"
  flux: "A photograph of an adult couple in their late twenties, a man and a woman in casual clothes, walking down a city street holding hands, full body, daylight."

