  juggernaut: "a full body nude photo of an adult man in his late twenties, completely naked, standing, facing the camera, bedroom, soft light"
  flux: "A full body nude photograph of an adult man in his late twenties, completely naked, standing in a bedroom and facing the camera in soft light."

couple-swimsuit:
  danbooru: "1girl, 1boy, hetero, couple, adult, bikini, swim trunks, topless male, standing, side-by-side, holding hands, full body, beach, day"
  juggernaut: "a full body photo of an adult couple in their late twenties, a woman in a bikini and a man in swim trunks, standing side by side holding hands, beach, daylight"
  flux: "A full body photograph of an adult couple in their late twenties, a woman in a bikini and a man in swim trunks, standing side by side on a beach and holding hands in daylight."

couple-underwear:
  danbooru: "1girl, 1boy, hetero, couple, adult, bra, panties, boxer briefs, topless male, standing, side-by-side, holding hands, full body, bedroom"
  juggernaut: "a full body photo of an adult couple in their late twenties, a woman in a bra and panties and a man in boxer briefs, standing side by side holding hands, bedroom, soft light"
  flux: "A full body photograph of an adult couple in their late twenties, a woman in a bra and panties and a man in boxer briefs, standing side by side in a bedroom and holding hands in soft light."

couple-nude:
  danbooru: "1girl, 1boy, hetero, couple, adult, completely nude, standing, side-by-side, holding hands, full body, bedroom"
  juggernaut: "a full body nude photo of an adult couple in their late twenties, a man and a woman, completely naked, standing side by side holding hands, bedroom, soft light"
