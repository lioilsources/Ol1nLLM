# Matice E — odhalení. Řádky = kdo × kolik, sloupce = modely, bez stylu.
#
# Otázka: udělá to model vůbec a jak čistě (anatomie, nechtěné oblečení zpět,
# nechtěná sexualizace)? Postoj je všude tentýž neutrální stoj, aby se měnilo
# jen oblečení. Všechny postavy jsou výslovně dospělé. Nekřížit se scénou
# `campus` z couple-scenes.yaml.
#
#   lab run --prompts-yaml tools/lab/candidates/clothing-minimal.yaml \
#           --models juggernaut-xl,flux-manga,illustrious-xl \
#           --flows txt2img --no-styles --sweep 'param.seed=777|778|779'

woman-swimsuit:
  danbooru: "1girl, solo, adult, mature female, bikini, standing, full body, facing viewer, beach, day"
  juggernaut: "a full body photo of an adult woman in her late twenties wearing a bikini, standing, facing the camera, beach, daylight"
  flux: "A full body photograph of an adult woman in her late twenties wearing a bikini, standing on a beach and facing the camera in daylight."

woman-underwear:
  danbooru: "1girl, solo, adult, mature female, underwear, bra, panties, standing, full body, facing viewer, bedroom"
  juggernaut: "a full body photo of an adult woman in her late twenties wearing a bra and panties, standing, facing the camera, bedroom, soft light"
  flux: "A full body photograph of an adult woman in her late twenties wearing a bra and panties, standing in a bedroom and facing the camera in soft light."

woman-nude:
  danbooru: "1girl, solo, adult, mature female, completely nude, standing, full body, facing viewer, bedroom"
  juggernaut: "a full body nude photo of an adult woman in her late twenties, completely naked, standing, facing the camera, bedroom, soft light"
  flux: "A full body nude photograph of an adult woman in her late twenties, completely naked, standing in a bedroom and facing the camera in soft light."

man-swimsuit:
  danbooru: "1boy, solo, adult, mature male, male swimwear, swim trunks, topless male, standing, full body, facing viewer, beach, day"
  juggernaut: "a full body photo of an adult man in his late twenties wearing swim trunks, standing, facing the camera, beach, daylight"
  flux: "A full body photograph of an adult man in his late twenties wearing swim trunks, standing on a beach and facing the camera in daylight."

man-underwear:
  danbooru: "1boy, solo, adult, mature male, male underwear, boxer briefs, topless male, standing, full body, facing viewer, bedroom"
  juggernaut: "a full body photo of an adult man in his late twenties wearing boxer briefs, standing, facing the camera, bedroom, soft light"
  flux: "A full body photograph of an adult man in his late twenties wearing boxer briefs, standing in a bedroom and facing the camera in soft light."

man-nude:
