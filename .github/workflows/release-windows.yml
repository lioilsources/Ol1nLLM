name: Release Windows

# Manual build check only. There is no private channel for desktop builds
# (Actions artifacts of a public repo are downloadable by anyone signed in),
# and a release build would carry the Cloudflare Access service token — so
# nothing is uploaded and no token goes in. Without it the app cannot reach
# the servers; this only proves the build.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build check windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        working-directory: .
        run: flutter pub get

      - name: Build Windows (release)
        working-directory: .
        run: flutter build windows --release
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
