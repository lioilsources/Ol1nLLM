name: Release Linux

# Manual build check only. There is no private channel for desktop builds
# (Actions artifacts of a public repo are downloadable by anyone signed in),
# and a release build would carry the Cloudflare Access service token — so
# nothing is uploaded and no token goes in. Without it the app cannot reach
# the servers; this only proves the build.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build check linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            desktop-file-utils

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        working-directory: .
        run: flutter pub get

      - name: Build Linux (release)
        working-directory: .
        run: flutter build linux --release
