name: Release macOS

# Manual build check only. There is no private channel for desktop builds
# (Actions artifacts of a public repo are downloadable by anyone signed in),
# and a release build would carry the Cloudflare Access service token — so
# nothing is uploaded and no token goes in. Without it the app cannot reach
# the servers; this only proves the build.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build check macos
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: .
        run: flutter pub get

      - name: Build macOS (release)
        working-directory: .
        run: flutter build macos --release
