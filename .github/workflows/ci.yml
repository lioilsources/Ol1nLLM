name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Tests & Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.x'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: .
        run: flutter pub get

      - name: Analyze
        working-directory: .
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: .
        # The screenshot goldens compare pixels and borrow macOS system fonts;
        # on this runner they would fail on rendering, not on a regression.
        run: flutter test --exclude-tags screenshots

  lab:
    name: Lab (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/lab

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/lab/go.mod
          cache-dependency-path: tools/lab/go.sum

      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  lab-web:
    name: Lab studio (Svelte)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/lab/web

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/lab/web/package-lock.json

      - name: Build
        run: npm ci --no-audit --no-fund && npm run build

  build-android-debug:
    name: Android Debug Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.x'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: .
        run: flutter pub get

      # No CF Access token in CI builds: their artifacts are downloadable by
      # anyone signed in to GitHub, and a build check does not need the servers.
      - name: Build APK (debug)
        working-directory: .
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-${{ github.sha }}
          path: ./build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  build-ios-debug:
    name: iOS Debug Build (Simulator)
    runs-on: macos-15
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.x'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: .
        run: flutter pub get

      - name: Build iOS (no signing)
        working-directory: .
        run: flutter build ios --debug --no-codesign

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-${{ github.sha }}
          path: ./build/ios/iphoneos/Runner.app
          retention-days: 7
